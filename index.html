<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>teqhs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- THEME PICKER OVERLAY -->
<div id="theme-picker">
    <div class="picker-content">
        <h2>Choose your look.</h2>
        <div class="picker-btns">
            <button class="picker-btn btn-dark" onclick="setInitialTheme('dark')">Dark Mode</button>
            <button class="picker-btn btn-light" onclick="setInitialTheme('light')">Light Mode</button>
        </div>
    </div>
</div>

<div class="bg-blobs">
    <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div><div class="blob blob-4"></div>
</div>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="#about">teqhs</a>
        <nav class="nav">
            <a href="#about" class="nav-link active">About</a>
            <a href="#education" class="nav-link">Education</a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                <svg viewBox="0 0 24 24" id="theme-icon"></svg>
            </button>
        </nav>
    </div>
</header>

<main>
    <section class="hero reveal" id="about">
        <h1>teqhs</h1>
        <p class="headline">maths, physics, and <span>java</span>.</p>
    </section>


    <section class="section reveal" id="education">
        <p class="section-label">Education</p>
        <div class="card-wrap">
            <div class="card">
                <div class="row" data-subject="Mathematics"><span class="subject">Mathematics</span><span class="grade highlight">Grade 9</span></div>
                <div class="row" data-subject="Physics"><span class="subject">Physics</span><span class="grade highlight">Grade 9</span></div>
                <div class="row" data-subject="Computer Science"><span class="subject">Computer Science</span><span class="grade">Grade 8</span></div>
                <div class="row" data-subject="Further Mathematics"><span class="subject">Further Mathematics</span><span class="grade highlight">Grade 9</span></div>
            </div>
        </div>
    </section>

    <section class="section reveal" id="contact">
        <p class="section-label">Contact</p>
        <div class="card-wrap">
            <div class="card contact-card">
                <a href="https://github.com/devteqhs" target="_blank" class="contact-link">
                    <span>GitHub</span><span class="contact-value">github.com/devteqhs</span>
                </a>
                <a href="#" class="contact-link">
                    <span>Discord</span><span class="contact-value">teqhs.</span>
                </a>
            </div>
        </div>
    </section>

    <footer>© 2026 teqhs</footer>


    <div class="modal" id="edu-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModals()">&times;</button>
            <div class="modal-header">
                <div class="modal-title-group">
                    <h2 id="edu-title">Subject</h2>
                    <div class="modal-grade-pill">
                        <span id="edu-grade">Grade X</span>
                        <span class="info-trigger" title="Grade 9 is the highest possible grade in the UK GCSE system, equivalent to an A* or the top ~3% of students.">?</span>
                    </div>
                </div>
            </div>
            <div class="info-grid">
                <div class="info-block"><span class="info-label">Exam Board</span><div id="edu-board" class="info-content"></div></div>
                <div class="info-block"><span class="info-label">Raw Marks</span><div id="edu-marks" class="info-content"></div></div>
            </div>
        </div>
    </div>

    <div id="lightbox"><img src=""></div>
</main>

<script src="script.js"></script>

</body>
</html>
